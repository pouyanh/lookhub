watchers:
  - name: "hot reload"
    watch:
      method: polling
      files:
        - path: .
          recursive: true
      filters:
        - list:
            - \.go$
    rateLimit:
      strategy: debounce
      wait: 100ms
    kill:
      signal: TERM
      timeout: 3s
    cmd:
      shell: /bin/sh -c
#      exec: dlv debug --headless -l :2345 --api-version=2 --accept-multiclient --log --continue --output __debug_bin ./cmd/server
      exec: go run ./cmd/server
