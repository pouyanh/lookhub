apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lookhub.fullname" . }}-dashboard
  namespace: {{ include "lookhub.namespace" . }}
  labels:
    {{- include "lookhub.labels" . | nindent 4 }}
    grafana_dashboard: "1" # Label required for Grafana sidecar discovery
data:
  dashboard.json: >
    {
      "id": null,
      "uid": "snplookhub",
      "title": "LookHub Dashboard",
      "tags": ["lookhub"],
      "timezone": "browser",
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "title": "Cache Hit Ratio",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "refId": "A",
              "expr": "rate(snp_lookhub_cache_hits_total[5m]) / rate(snp_lookhub_requests_total[5m])"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 0,
            "h": 10,
            "w": 12
          }
        },
        {
          "id": 2,
          "title": "Requests Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "refId": "B",
              "expr": "rate(snp_lookhub_requests_total[5m])"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 0,
            "h": 10,
            "w": 12
          }
        }
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "style": "dark"
    }
