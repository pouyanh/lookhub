---
prebuild:setup:
  stage: prebuild
  image: "${GO_IMAGE}"
  script:
    - chmod +x ./.gitlab/ci/scripts/00-00-prebuild-setup.sh
    - ./.gitlab/ci/scripts/00-00-prebuild-setup.sh
  artifacts:
    paths:
      - vendor

# todo: prebuild:lint:
#   stage: prebuild
#   needs:
#     - prebuild:setup
#   image: "${GO_IMAGE}"
#   script:
#     - chmod +x ./.gitlab/ci/scripts/00-02-prebuild-lint.sh
#     - ./.gitlab/ci/scripts/00-02-prebuild-lint.sh

prebuild:test:
  stage: prebuild
  needs:
    - prebuild:setup
  image: "${GO_IMAGE}"
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+\%)/'
  # todo: INTEGRATION_TEST: - if: $CI_COMMIT_TAG
  script:
    - chmod +x ./.gitlab/ci/scripts/00-01-prebuild-test.sh
    - ./.gitlab/ci/scripts/00-01-prebuild-test.sh

prebuild:security:
  stage: prebuild
  needs:
    - prebuild:setup
  trigger:
    include:
      - project: 'security/AppSec'
        file:
          - 'sast.yml'
          - 'secret-detection.yml'
          - 'iac-scanning.yml'
          - 'sca.yml'
