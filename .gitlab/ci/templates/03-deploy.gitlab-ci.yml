---
.deploy:
  stage: deploy
  image:
    name: "${HELM_IMAGE}"
    entrypoint: ["/bin/sh", "-c"]
  script:
    - apk add --update ncurses
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - chmod +x ./.gitlab/ci/scripts/03-00-deploy.sh
    - ./.gitlab/ci/scripts/03-00-deploy.sh
  variables:
    SECURE_FILES_DOWNLOAD_PATH: "./.deployment/lookhub/secrets/"

deploy:staging:
  extends: .deploy
  needs:
    - post-release:security:staging
  variables:
    ENVIRONMENT: "staging"
    NAMESPACE: "${STG_NAMESPACE}"
    KUBE_APISERVER: "${STG_KUBE_APISERVER}"
    KUBE_TOKEN: "${STG_KUBE_TOKEN}"
    OKD_HOST: "${STG_OKD_HOST}"
    IMAGE_REPO: "${STG_IMAGE_REPO}"
    IMAGE_TAG: "${STG_IMAGE_TAG}"

deploy:production:
  extends: .deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - post-release:security:production
  variables:
    ENVIRONMENT: "production"
    NAMESPACE: "${PRD_NAMESPACE}"
    KUBE_APISERVER: "${PRD_KUBE_APISERVER}"
    KUBE_TOKEN: "${PRD_KUBE_TOKEN}"
    OKD_HOST: "${PRD_OKD_HOST}"
    IMAGE_REPO: "${PRD_IMAGE_REPO}"
    IMAGE_TAG: "${PRD_IMAGE_TAG}"
